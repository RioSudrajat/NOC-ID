services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: noc
      POSTGRES_PASSWORD: noc_dev
      POSTGRES_DB: noc_id
    ports:
      - "5432:5432"
    volumes:
      - noc_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: noc
      MINIO_ROOT_PASSWORD: noc_minio_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - noc_minio:/data

volumes:
  noc_postgres:
  noc_minio:
